name: Fork Desktop Build

# Builds the desktop app on GitHub-hosted runners and publishes it as a normal
# GitHub release of the fork. Installed fork builds read their updates from that
# release (`/releases/latest` and the latest*.yml assets); a copy of the three
# newest releases stays in the fork's object storage as a private backup. Only the fork
# runs this; the tag prefix `mf-desktop-v` matches none of the tag triggers of
# the upstream workflows (`v*`, `desktop-v*`, `app-v*`, `android-v*`, ...), and
# the one workflow with a release trigger skips that prefix.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.14.0-mf.3 or 0.14.0-beta.1.mf.3. Empty derives it from the desktop package version and the run number."
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag or SHA to build. Empty builds the ref the workflow was started from."
        required: false
        default: ""
        type: string
      notify:
        description: "Send a Buzz message when the build finishes or fails."
        required: false
        default: true
        type: boolean
      prune_dry_run:
        description: "Build nothing; only log which Wasabi backup versions the prune would keep and delete."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 0.14.0-mf.3 or 0.14.0-beta.1.mf.3. Empty derives it from the desktop package version and the run number."
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag or SHA to build. Empty builds the caller's ref."
        required: false
        default: ""
        type: string
      notify:
        description: "Send a Buzz message when the build finishes or fails. Callers normally send their own."
        required: false
        default: false
        type: boolean
      # Declared for both triggers so the expressions below see a boolean in each.
      prune_dry_run:
        description: "Build nothing; only log which backup versions the prune would keep and delete."
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: Published version, for example 0.14.0-mf.3.
        value: ${{ jobs.publish.outputs.version }}
      download_base_url:
        description: Public GitHub release download directory that holds this version's installers.
        value: ${{ jobs.publish.outputs.download_base_url }}
      download_links:
        description: Markdown list of installer links, one per line.
        value: ${{ jobs.publish.outputs.download_links }}
      release_url:
        description: GitHub release page of this version.
        value: ${{ jobs.publish.outputs.release_url }}
      changelog:
        description: Vietnamese changelog in Markdown. Empty when it could not be written.
        value: ${{ jobs.publish.outputs.changelog }}

# A prune dry run only reads the backup listing, so it gets its own group:
# joining the build group would cancel a release that is waiting in the queue.
concurrency:
  group: fork-desktop-build${{ inputs.prune_dry_run && '-prune-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DESKTOP_PACKAGE_PATH: packages/desktop
  WASABI_ENDPOINT: https://s3.ap-southeast-1.wasabisys.com
  WASABI_BUCKET: game-mobile-registry
  WASABI_PREFIX: paseo-desktop

jobs:
  setup:
    if: github.repository == 'kevinle128/paseo' && !inputs.prune_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check publish secrets
        env:
          WASABI_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
          WASABI_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [[ -n "$WASABI_ACCESS_KEY_ID" ]] || missing+=(WASABI_ACCESS_KEY_ID)
          [[ -n "$WASABI_SECRET_ACCESS_KEY" ]] || missing+=(WASABI_SECRET_ACCESS_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions, or pass them with 'secrets: inherit' when calling this workflow."
            exit 1
          fi

      - name: Check the updater feed matches this repository
        run: |
          config="${DESKTOP_PACKAGE_PATH}/electron-builder.fork.yml"
          for expected in \
            "owner: ${GITHUB_REPOSITORY%/*}" \
            "repo: ${GITHUB_REPOSITORY#*/}" \
            "downloadBaseUrl: https://github.com/${GITHUB_REPOSITORY}/releases/download"; do
            if ! grep -Fq "$expected" "$config"; then
              echo "::error::${config} is missing '${expected}'"
              exit 1
            fi
          done

      - name: Resolve version and tag
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            base="$(node -p "require('./${DESKTOP_PACKAGE_PATH}/package.json').version")"
            if [[ "$base" == *-* ]]; then
              prefix="${base}.mf."
            else
              prefix="${base}-mf."
            fi
            # A called workflow sees the caller's run number, so derive N from
            # the published tags instead. The next build is always higher.
            last="$(git ls-remote --tags origin "refs/tags/mf-desktop-v${prefix}*" \
              | sed -n "s|.*refs/tags/mf-desktop-v${prefix//./\\.}\([0-9][0-9]*\)\$|\1|p" \
              | sort -n | tail -1)"
            version="${prefix}$(( ${last:-0} + 1 ))"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+\.mf\.[0-9]+|-mf\.[0-9]+)$ ]]; then
            echo "::error::Version '$version' must look like X.Y.Z-mf.N or X.Y.Z-beta.K.mf.N"
            exit 1
          fi
          tag="mf-desktop-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::Tag ${tag} already exists. Choose another version."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${version} from $(git rev-parse HEAD)"

  build-macos:
    needs: [setup]
    if: github.repository == 'kevinle128/paseo'
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted macOS arm64 jobs of the fork are often never given a
          # machine, so arm64 builds on the self-hosted mac mini, as Buzz does.
          - runner: [self-hosted, macOS, ARM64, paseo]
            electron_arch: arm64
            node_heap_mb: 4096
          - runner: macos-15-intel
            electron_arch: x64
            node_heap_mb: 8192
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DESKTOP_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      # The mini also runs the Buzz desktop build through its own runner. Both
      # jobs take this lock, so only one desktop build runs on the mini at a
      # time. lockf holds the lock while its child sleeps; the last step kills
      # the child, and the runner kills it when the job ends, so a cancelled
      # job also frees the lock.
      - name: Wait for the mini build lock
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          lock="$HOME/.mini-desktop-build.lock"
          ready="$RUNNER_TEMP/mini-build-lock.pid"
          rm -f "$ready"
          # shellcheck disable=SC2016 # $$ and $1 expand in the child shell.
          nohup /usr/bin/lockf -k -t 3600 "$lock" /bin/sh -c 'echo $$ > "$1"; exec sleep 21600' sh "$ready" \
            > /dev/null 2>&1 &
          holder=$!
          for _ in $(seq 3600); do
            [[ -s "$ready" ]] && break
            kill -0 "$holder" 2> /dev/null || { echo "::error::Gave up waiting for the mini build lock after 1 hour"; exit 1; }
            sleep 1
          done
          [[ -s "$ready" ]] || { echo "::error::The mini build lock was not taken"; exit 1; }
          echo "MINI_BUILD_LOCK_PID_FILE=$ready" >> "$GITHUB_ENV"
          echo "Took the mini build lock."

      - name: Check free disk space
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          min_gib=25
          free_gib=$(( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1024 / 1024 ))
          echo "Free space for the workspace: ${free_gib} GiB (need ${min_gib} GiB)."
          if (( free_gib < min_gib )); then
            echo "::error::Only ${free_gib} GiB free on the mini; a desktop build needs ${min_gib} GiB"
            exit 1
          fi

      # The mini keeps its home folder between jobs. Downloads and caches go to
      # the job temp folder so the last step removes them, and the keychain
      # search list is saved so the last step can undo what signing adds.
      - name: Use job-local caches
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "npm_config_cache=$RUNNER_TEMP/job-cache/npm"
            echo "ELECTRON_CACHE=$RUNNER_TEMP/job-cache/electron"
            echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/job-cache/electron-builder"
            echo "KEYCHAIN_LIST_BACKUP=$RUNNER_TEMP/keychain-search-list.txt"
          } >> "$GITHUB_ENV"
          security list-keychains -d user | tr -d '"' | xargs -n1 > "$RUNNER_TEMP/keychain-search-list.txt"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set desktop package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json');
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          packageJson.version = process.env.DESKTOP_VERSION;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      # No Developer ID: the fork config signs ad hoc and skips notarization.
      - name: Build desktop app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          # Metro's jest workers OOM on the generated ws-outbound.aot.js validator,
          # the last module in the web bundle. Node's default heap is sized from
          # runner RAM, which is not enough on the Intel runner.
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          set -euo pipefail
          # Hosted macOS runners sometimes keep the scratch DMG volume busy, so
          # dmgbuild cannot detach it (actions/runner-images#7522). Only that
          # failure is retried. The whole build runs again, so the packaged smoke
          # test also runs again on the app that is shipped.
          retry_bin="$(mktemp -d)"
          trap 'rm -rf "$retry_bin"' EXIT
          cat > "$retry_bin/retry-busy-dmg" <<'DMGRETRY'
          #!/bin/bash
          set -uo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          for attempt in 1 2 3; do
            "$@" 2>&1 | tee "$output"
            status="${PIPESTATUS[0]}"
            if [[ "$status" == 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] ||
              ! grep -Fq "hdiutil: couldn't eject" "$output" ||
              ! grep -Fq "Resource busy" "$output"; then
              exit "$status"
            fi
            echo "::warning::The DMG volume stayed busy after packaging; building again ($attempt/3)" >&2
            rm -f "$DMG_RELEASE_DIR"/*.dmg "$DMG_RELEASE_DIR"/*.dmg.blockmap
            sleep 30
          done
          DMGRETRY
          chmod +x "$retry_bin/retry-busy-dmg"
          DMG_RELEASE_DIR="${DESKTOP_PACKAGE_PATH}/release" "$retry_bin/retry-busy-dmg" \
            npm run build:desktop -- --config electron-builder.fork.yml --publish never --mac --${{ matrix.electron_arch }}

      # The packaged app reads this file to find its updates. A wrong owner here
      # ships a build that updates from another project.
      - name: Check the baked update feed
        shell: bash
        run: |
          set -euo pipefail
          files="$(find "${DESKTOP_PACKAGE_PATH}/release" -name app-update.yml)"
          if [[ -z "$files" ]]; then
            echo "::error::No app-update.yml in the packaged app"
            exit 1
          fi
          while IFS= read -r file; do
            cat "$file"
            for expected in "provider: github" "owner: ${GITHUB_REPOSITORY%/*}" "repo: ${GITHUB_REPOSITORY#*/}"; do
              grep -Fxq "$expected" "$file" || { echo "::error::${file} lacks '${expected}'"; exit 1; }
            done
            # updaterCacheDirName is a local cache folder electron-builder derives
            # from the package name (@getpaseo/desktop); it is not a feed.
            if grep -v '^updaterCacheDirName:' "$file" | grep -Eiq 'getpaseo|wasabi'; then
              echo "::error::${file} points at another feed"
              exit 1
            fi
          done <<< "$files"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-smoke-macos-${{ matrix.electron_arch }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fork-desktop-macos-${{ matrix.electron_arch }}
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.dmg
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.zip
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: fork-manifest-macos-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

      - name: Clean the mini
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Undo keychain changes: drop every keychain that is not in the saved
          # list, then put the saved list back.
          if [[ -s "${KEYCHAIN_LIST_BACKUP:-}" ]]; then
            security list-keychains -d user | tr -d '"' | xargs -n1 | while IFS= read -r keychain; do
              grep -Fxq "$keychain" "$KEYCHAIN_LIST_BACKUP" || security delete-keychain "$keychain" 2> /dev/null || true
            done
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$KEYCHAIN_LIST_BACKUP")
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          rm -rf "$RUNNER_TEMP/job-cache" "$RUNNER_TEMP/desktop-smoke" "${KEYCHAIN_LIST_BACKUP:-/nonexistent}"
          if [[ -s "${MINI_BUILD_LOCK_PID_FILE:-}" ]]; then
            kill "$(cat "$MINI_BUILD_LOCK_PID_FILE")" 2> /dev/null || true
            rm -f "$MINI_BUILD_LOCK_PID_FILE"
            echo "Released the mini build lock."
          fi

  build-windows:
    needs: [setup]
    if: github.repository == 'kevinle128/paseo'
    permissions:
      contents: read
      packages: read
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DESKTOP_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set desktop package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json');
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          packageJson.version = process.env.DESKTOP_VERSION;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      # Unsigned: the fork config turns off update signature verification.
      - name: Build desktop app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          npm run build:desktop -- --config electron-builder.fork.yml --publish never --win --x64

      # The packaged app reads this file to find its updates. A wrong owner here
      # ships a build that updates from another project.
      - name: Check the baked update feed
        shell: bash
        run: |
          set -euo pipefail
          files="$(find "${DESKTOP_PACKAGE_PATH}/release" -name app-update.yml)"
          if [[ -z "$files" ]]; then
            echo "::error::No app-update.yml in the packaged app"
            exit 1
          fi
          while IFS= read -r file; do
            cat "$file"
            for expected in "provider: github" "owner: ${GITHUB_REPOSITORY%/*}" "repo: ${GITHUB_REPOSITORY#*/}"; do
              grep -Fxq "$expected" "$file" || { echo "::error::${file} lacks '${expected}'"; exit 1; }
            done
            # updaterCacheDirName is a local cache folder electron-builder derives
            # from the package name (@getpaseo/desktop); it is not a feed.
            if grep -v '^updaterCacheDirName:' "$file" | grep -Eiq 'getpaseo|wasabi'; then
              echo "::error::${file} points at another feed"
              exit 1
            fi
          done <<< "$files"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-smoke-windows-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fork-desktop-windows-x64
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.exe
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.zip
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: fork-manifest-windows-x64
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/latest.yml
          if-no-files-found: error
          retention-days: 3

  build-linux:
    needs: [setup]
    if: github.repository == 'kevinle128/paseo'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DESKTOP_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set desktop package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageJsonPath = path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json');
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          packageJson.version = process.env.DESKTOP_VERSION;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install Linux smoke display and rpm tooling
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth rpm

      - name: Build desktop app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          npm run build:desktop -- --config electron-builder.fork.yml --publish never --linux --x64

      # The packaged app reads this file to find its updates. A wrong owner here
      # ships a build that updates from another project.
      - name: Check the baked update feed
        shell: bash
        run: |
          set -euo pipefail
          files="$(find "${DESKTOP_PACKAGE_PATH}/release" -name app-update.yml)"
          if [[ -z "$files" ]]; then
            echo "::error::No app-update.yml in the packaged app"
            exit 1
          fi
          while IFS= read -r file; do
            cat "$file"
            for expected in "provider: github" "owner: ${GITHUB_REPOSITORY%/*}" "repo: ${GITHUB_REPOSITORY#*/}"; do
              grep -Fxq "$expected" "$file" || { echo "::error::${file} lacks '${expected}'"; exit 1; }
            done
            # updaterCacheDirName is a local cache folder electron-builder derives
            # from the package name (@getpaseo/desktop); it is not a feed.
            if grep -v '^updaterCacheDirName:' "$file" | grep -Eiq 'getpaseo|wasabi'; then
              echo "::error::${file} points at another feed"
              exit 1
            fi
          done <<< "$files"

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fork-desktop-linux-x64
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.AppImage
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.deb
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.rpm
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.tar.gz
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: fork-manifest-linux-x64
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

  # Runs only when every platform built, so a feed never names a missing
  # installer. The release is created as a draft with every asset and published
  # last, so a client never sees a release that is still missing files.
  publish:
    needs: [setup, build-macos, build-windows, build-linux]
    if: github.repository == 'kevinle128/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ needs.setup.outputs.version }}
      download_base_url: ${{ steps.links.outputs.base_url }}
      download_links: ${{ steps.links.outputs.links }}
      release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.setup.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.text }}
      # `outcome`, not `conclusion`: the backup step continues on error, so its
      # conclusion is success even when the upload failed.
      backup_outcome: ${{ steps.backup.outcome }}
    env:
      UPSTREAM_URL: https://github.com/getpaseo/paseo.git
      VERSION: ${{ needs.setup.outputs.version }}
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      SOURCE_SHA: ${{ needs.setup.outputs.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            scripts
            .github/actions
          ref: ${{ needs.setup.outputs.sha }}
          # The changelog walks the commits since the previous release.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: fork-desktop-*
          path: release
          merge-multiple: true

      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          pattern: fork-manifest-*
          path: manifests

      - name: Build feed manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merged feed
          node scripts/merge-mac-manifest.mjs \
            manifests/fork-manifest-macos-arm64/latest-mac.yml \
            manifests/fork-manifest-macos-x64/latest-mac.yml \
            merged/latest-mac.yml > /dev/null
          cp manifests/fork-manifest-windows-x64/latest.yml merged/latest.yml
          cp manifests/fork-manifest-linux-x64/latest-linux.yml merged/latest-linux.yml
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            node scripts/fork-desktop-manifest.mjs "merged/${name}" "$VERSION" release "feed/${name}"
          done
          ls -la release feed

      # Names come from the files that are uploaded, so the links cannot drift
      # from the artifact name templates.
      - name: Collect download links
        id: links
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          {
            echo "base_url=${base}"
            echo "links<<LINKS_EOF"
            for file in release/*.dmg release/*.exe release/*.AppImage release/*.deb; do
              [[ -f "$file" ]] || continue
              name="$(basename "$file")"
              case "$name" in
                *-arm64.dmg) label="macOS arm64 DMG" ;;
                *-x64.dmg) label="macOS x64 DMG" ;;
                *.exe) label="Windows installer" ;;
                *.AppImage) label="Linux AppImage" ;;
                *.deb) label="Linux deb" ;;
                *) label="$name" ;;
              esac
              echo "- ${label}: ${base}/${name}"
            done
            echo "LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release with every asset
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Paseo desktop ${VERSION}" \
            --notes "Fork desktop build ${VERSION} from ${SOURCE_SHA}." \
            --draft \
            release/* feed/latest-mac.yml feed/latest.yml feed/latest-linux.yml
          # GitHub renames some asset names on upload, and a renamed asset would
          # leave the update manifests pointing at a file that does not exist.
          expected="$( (ls release; ls feed) | sort)"
          actual="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Release assets differ from the build output."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      # Normal release, marked latest: electron-updater reads /releases/latest,
      # which never returns a prerelease or a draft.
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "::error::/releases/latest returns ${latest}, expected ${RELEASE_TAG}"
            exit 1
          fi

      # Best effort. The release is already published here, so nothing in the
      # changelog may fail the job: the script falls back to the raw English
      # change list when the endpoint settings are missing or the API call
      # fails, and continue-on-error covers a crash of the script itself. The
      # endpoint is reachable only inside the tailnet.
      - name: Join tailnet for the changelog
        continue-on-error: true
        uses: ./.github/actions/join-tailnet
        with:
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Write Vietnamese changelog
        id: changelog
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          previous="$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName' \
            | grep '^mf-desktop-v' | grep -vxF "$RELEASE_TAG" | head -n 1; } || true)"
          echo "Previous release: ${previous:-none}"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main || echo "::warning::Could not fetch upstream main; upstream changes are not separated."
          changelog="${RUNNER_TEMP}/changelog.md"
          node scripts/fork-release-changelog.mjs \
            --previous-tag "$previous" --head "$SOURCE_SHA" --version "$VERSION" --out "$changelog"
          {
            echo "Fork desktop build ${VERSION} from ${SOURCE_SHA}."
            echo
            cat "$changelog"
          } > "${RUNNER_TEMP}/release-notes.md"
          delimiter="CHANGELOG_$(openssl rand -hex 8)"
          {
            echo "text<<${delimiter}"
            cat "$changelog"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Add changelog to the release notes
        if: ${{ steps.changelog.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "${RUNNER_TEMP}/release-notes.md"

      # A draft that was never published is invisible to clients; remove it so
      # the same version can be retried.
      - name: Remove unpublished draft release
        if: failure()
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$is_draft" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      # Private backup copy. Clients never read it, so a failure here must not
      # undo or block a release that is already published.
      - name: Back up release files to Wasabi
        id: backup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="s3://${WASABI_BUCKET}/${WASABI_PREFIX}/${VERSION}/"
          if [[ -n "$(aws s3 ls "$target" --endpoint-url "$WASABI_ENDPOINT")" ]]; then
            echo "::error::${target} already has files."
            exit 1
          fi
          aws s3 cp release "$target" --recursive --endpoint-url "$WASABI_ENDPOINT" --only-show-errors
          aws s3 cp feed "$target" --recursive --endpoint-url "$WASABI_ENDPOINT" --only-show-errors
          uploaded="$(aws s3 ls "$target" --endpoint-url "$WASABI_ENDPOINT" | wc -l | tr -d ' ')"
          expected="$(find release feed -type f | wc -l | tr -d ' ')"
          if [[ "$uploaded" != "$expected" ]]; then
            echo "::error::Backed up ${uploaded} files, expected ${expected}"
            exit 1
          fi

  # Keeps only the newest versions in the private Wasabi backup. Clients read
  # updates and installers from GitHub Releases, so nothing they use is deleted;
  # GitHub releases stay as they are. Only whole version folders go, never a
  # file at the backup root, and only after the new version's backup uploaded
  # completely. A dry run builds nothing and deletes nothing.
  prune-backups:
    needs: [setup, publish]
    if: ${{ always() && github.repository == 'kevinle128/paseo' && (inputs.prune_dry_run || (needs.publish.result == 'success' && needs.publish.outputs.backup_outcome == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha || github.sha }}
          sparse-checkout: scripts

      - name: Delete older backup versions
        id: prune
        shell: bash
        env:
          CURRENT: ${{ needs.setup.outputs.version }}
          DRY_RUN: ${{ inputs.prune_dry_run && 'true' || 'false' }}
          KEEP: "3"
        run: |
          set -euo pipefail
          listing="${RUNNER_TEMP}/backup-listing.txt"
          delete_list="${RUNNER_TEMP}/backup-delete.txt"
          if ! aws s3 ls "s3://${WASABI_BUCKET}/${WASABI_PREFIX}/" --endpoint-url "$WASABI_ENDPOINT" > "$listing"; then
            echo "::warning::Could not list the backup; nothing is deleted."
            exit 0
          fi
          args=(--listing "$listing" --keep "$KEEP" --out "$delete_list")
          if [[ -n "$CURRENT" ]]; then
            args+=(--current "$CURRENT")
          elif [[ "$DRY_RUN" != "true" ]]; then
            echo "::error::No version for this release; nothing is deleted."
            exit 1
          fi
          node scripts/fork-desktop-backup-prune.mjs "${args[@]}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: nothing is deleted."
            exit 0
          fi
          while IFS= read -r version; do
            [[ -n "$version" ]] || continue
            aws s3 rm "s3://${WASABI_BUCKET}/${WASABI_PREFIX}/${version}/" --recursive \
              --endpoint-url "$WASABI_ENDPOINT" --only-show-errors
            echo "Deleted backup ${version}"
          done < "$delete_list"

  # Manual runs report their own result; a calling workflow reports its own.
  notify:
    needs: [setup, publish]
    if: ${{ always() && github.repository == 'kevinle128/paseo' && inputs.notify && needs.setup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Compose message
        id: compose
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.setup.outputs.version }}
          CHANGELOG: ${{ needs.publish.outputs.changelog }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            event=release.published
            key=build-published
            text="🚀 Paseo fork ${VERSION} đã sẵn sàng"
            if [[ -n "$CHANGELOG" ]]; then
              text+=$'\n\n'"${CHANGELOG}"
            fi
            text+=$'\n\n'"Tải về: ${RELEASE_URL}"$'\n'"Windows và Linux (AppImage) tự cập nhật. macOS: tải file DMG và thay Paseo trong thư mục Applications."
          else
            event=build.failed
            key=build-failed
            text="❌ Build Paseo fork thất bại ${VERSION:+(${VERSION}) }- ${RUN_URL}"
          fi
          delimiter="TEXT_$(openssl rand -hex 8)"
          {
            echo "event=${event}"
            echo "key=${key}"
            echo "text<<${delimiter}"
            echo "$text"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Buzz
        uses: ./.github/actions/buzz-notify
        with:
          event_type: ${{ steps.compose.outputs.event }}
          content: ${{ steps.compose.outputs.text }}
          idempotency_key: ${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.compose.outputs.key }}
          callback_url: ${{ secrets.BUZZ_APP_CALLBACK_URL }}
          app_secret: ${{ secrets.BUZZ_APP_SECRET }}
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
