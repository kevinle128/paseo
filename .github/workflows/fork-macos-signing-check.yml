name: Fork macOS Signing Check

# Proves the Apple signing credentials in the `desktop-signing` environment
# before any signed build: the Developer ID certificate imports and is a valid
# code-signing identity, and the App Store Connect API key can talk to the
# notary service. It builds and publishes nothing. Only the identity name and
# pass/fail results go to the log; no secret value is printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'kevinle128/paseo'
    # Same runner image as the arm64 job in fork-desktop-build.yml.
    runs-on: macos-15
    environment: desktop-signing
    timeout-minutes: 15
    steps:
      - name: Set temporary paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing-check.keychain-db" >> "$GITHUB_ENV"
          echo "KEY_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$APPLE_CERTIFICATE" ]] || { echo "::error::APPLE_CERTIFICATE is empty"; exit 1; }
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/signing-check.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          if ! security import "$p12" -k "$KEYCHAIN_PATH" -f pkcs12 \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null; then
            rm -f "$p12"
            echo "::error::security import rejected the .p12 (wrong password or unsupported encryption)"
            exit 1
          fi
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          # Put the temporary keychain first in the search list so the chain
          # resolves the way a signing build would see it.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing

      - name: Find the code-signing identity
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          line=$(printf '%s\n' "$identities" | grep 'Developer ID Application:' | head -1 || true)
          if [[ -z "$line" ]]; then
            echo "::error::No valid 'Developer ID Application' identity in the keychain"
            echo "All identities, including invalid ones (names only):"
            security find-identity -p codesigning "$KEYCHAIN_PATH" | sed -E 's/[0-9A-F]{40}/<sha1>/'
            exit 1
          fi
          # Print the name only, without the SHA-1 hash. The Team ID is a
          # secret, so the log shows it masked; the match is checked here.
          name=$(printf '%s\n' "$line" | sed -E 's/^.*"(.*)"$/\1/')
          echo "Identity: $name"
          team=$(printf '%s\n' "$name" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          trimmed=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          if [[ "$trimmed" != "$APPLE_TEAM_ID" ]]; then
            echo "::warning::APPLE_TEAM_ID has whitespace or a line break (${#APPLE_TEAM_ID} chars, ${#trimmed} without whitespace). Set the secret again without it."
          fi
          if [[ "$team" != "$trimmed" ]]; then
            echo "::error::Team ID in the certificate does not match APPLE_TEAM_ID (secret has ${#trimmed} characters without whitespace; a Team ID has 10)"
            exit 1
          fi
          echo "Team ID in the certificate matches APPLE_TEAM_ID."
          printf '%s\n' "$identities" | tail -1

      - name: Check the notary service with the API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for var in APPLE_API_KEY_ID APPLE_API_ISSUER; do
            value=${!var}
            trimmed=$(printf '%s' "$value" | tr -d '[:space:]')
            if [[ "$trimmed" != "$value" ]]; then
              echo "::warning::$var has whitespace or a line break (${#value} chars, ${#trimmed} without whitespace). Set the secret again without it."
            fi
            printf -v "$var" '%s' "$trimmed"
          done
          mkdir -p "$KEY_DIR"
          key_path="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          head -1 "$key_path" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }
          if ! out=$(xcrun notarytool history --key "$key_path" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --output-format json 2>&1); then
            echo "::error::notarytool history failed"
            # notarytool errors name the failure (401, key not found) and hold no key material.
            printf '%s\n' "$out" | tail -5
            exit 1
          fi
          count=$(printf '%s\n' "$out" | jq '.history | length')
          echo "notarytool history OK: $count earlier submission(s)."

      - name: Remove the keychain and the key file
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "$KEY_DIR" "$RUNNER_TEMP/signing-check.p12"
