# Fork build overlay. Extends the upstream config so upstream merges stay clean.
extends: ./electron-builder.yml
extraMetadata:
  # Read by src/features/fork-update-config.ts to pick the updater behavior.
  paseoFork:
    macUpdateMode: notify
    # Release assets live at <downloadBaseUrl>/<tag>/<file>. Keep in step with
    # the publish entry below.
    downloadBaseUrl: https://github.com/kevinle128/paseo/releases/download
# A list replaces the base github entry; a plain object would be merged into it
# and keep the upstream owner and repo.
publish:
  - provider: github
    owner: kevinle128
    repo: paseo
    releaseType: release
    # The app always requests the "latest" channel, so the manifests must be
    # named latest*.yml whatever prerelease id the version has.
    channel: latest
mac:
  identity: "-"
  notarize: false
win:
  verifyUpdateCodeSignature: false
